<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador de Rifas Interactivo</title>
    <!-- Incluyendo html2canvas para exportar la imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #ff6b81;
            --primary-light: #ffebf0;
            --bg-color: #f1f2f6;
            --text-main: #2d3436;
            --card-bg: #fffcfd;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            flex-direction: row; /* Por defecto en PC */
        }

        .controls {
            width: 350px;
            background: white;
            padding: 1.5rem;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            overflow-y: auto;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .controls h2 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #636e72;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #ff4757; }
        
        .btn-success { background: #2ed573; color: white; margin-top: 1rem; }
        .btn-success:hover { background: #26de81; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3); }

        .btn-danger { background: transparent; color: #ff4757; border: 1px solid #ff4757; margin-top: 1rem; }
        .btn-danger:hover { background: #ffebf0; }

        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-y: auto;
            background-color: #e2e8f0;
        }

        /* Contenedor que será exportado a imagen */
        #export-container {
            padding: 10px; /* Margen para la foto exportada */
            background: transparent;
        }

        .raffle-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
            /* Patrón de fondo suave tipo floral/puntos */
            background-image: radial-gradient(#ffebf0 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .r-title {
            background: var(--primary-light);
            color: var(--text-main);
            padding: 0.8rem 1rem;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            word-wrap: break-word;
        }

        .r-price {
            background: white;
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .r-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .r-number {
            background: #ffe0e6;
            color: var(--text-main);
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            user-select: none;
            position: relative;
            border: 1px solid white;
        }

        @media (hover: hover) {
            .r-number:hover {
                transform: scale(1.05);
                background: #ffc4d0;
            }
        }

        .r-number.taken {
            background: rgba(255, 255, 255, 0.5);
            color: transparent;
        }

        /* Emoji de quesillo para marcar los vendidos */
        .r-number.taken::after {
            content: "🍮";
            position: absolute;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .r-footer {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            white-space: pre-line;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 0.95rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            width: 90%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h3 { margin-bottom: 0.8rem; color: var(--text-main); }
        .modal-content p { color: #636e72; margin-bottom: 1.5rem; font-size: 0.95rem; }

        .modal-btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn-outline { background: transparent; border: 2px solid #dfe6e9; color: #636e72; }
        .btn-outline:hover { background: #f1f2f6; }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100dvh; /* Usa dynamic viewport height si es posible */
                overflow-y: auto; /* Permite hacer scroll vertical en todo el body */
            }

            .controls {
                width: 100%;
                flex-shrink: 0; /* Evita que los controles se encojan */
                border-bottom: 2px solid var(--primary-light);
                padding: 1rem;
            }

            .preview-area {
                padding: 1rem;
                align-items: flex-start; /* Para que la tarjeta quede arriba al hacer scroll */
                min-height: calc(100vh - 300px); /* Asegura que haya espacio */
            }

            .raffle-card {
                padding: 1.5rem 1rem;
            }

            .r-grid {
                gap: 5px; /* Reduce el espacio entre números en pantallas muy pequeñas */
            }

            .r-number {
                font-size: 1.2rem;
            }
            
            .r-number.taken::after {
                font-size: 1.5rem; /* Emoji ligeramente más pequeño */
            }
        }
    </style>
</head>
<body>

    <!-- Modal del Asistente -->
    <div id="wizard" class="modal-overlay">
        <div class="modal-content">
            <h3>¡Bienvenido! 🎉</h3>
            <p>Configuremos los datos principales de tu rifa para empezar.</p>
            
            <div class="input-group" style="text-align: left;">
                <input type="text" id="wiz-title" placeholder="Ej: Rifa de un Quesillo">
            </div>
            <div class="input-group" style="text-align: left;">
                <input type="text" id="wiz-price" placeholder="Valor (Ej: 1200bs)">
            </div>

            <div class="modal-btn-group">
                <button class="btn btn-outline" onclick="closeWizard()">Saltar</button>
                <button class="btn btn-primary" onclick="saveWizard()">Comenzar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación para borrar datos -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>⚠️ ¿Limpiar todo?</h3>
            <p>Se borrarán todos los números marcados y la configuración volverá a su estado inicial. Esto no se puede deshacer.</p>
            <div class="modal-btn-group">
                <button class="btn btn-outline" onclick="closeConfirmModal()">Cancelar</button>
                <button class="btn" style="background:#ff4757; color:white;" onclick="executeClearAll()">Sí, borrar todo</button>
            </div>
        </div>
    </div>

    <aside class="controls">
        <h2>✏️ Editar Rifa</h2>
        
        <div class="input-group">
            <label>Título de la Rifa</label>
            <input type="text" id="ctrl-title" oninput="updatePreview()">
        </div>

        <div class="input-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Valor / Precio</label>
                <input type="text" id="ctrl-price" oninput="updatePreview()">
            </div>
            <div style="flex: 1;">
                <label>Números</label>
                <input type="number" id="ctrl-count" min="5" max="100" value="20" onchange="generateGrid()">
            </div>
        </div>

        <div class="input-group">
            <label>Color Base (Tarjeta)</label>
            <input type="color" id="ctrl-bg-color" value="#ffffff" oninput="updatePreview()" style="height: 40px; padding: 2px;">
        </div>

        <div class="input-group">
            <label>Info de Contacto / Pagos</label>
            <textarea id="ctrl-footer" rows="3" oninput="updatePreview()"></textarea>
        </div>

        <button class="btn btn-success" onclick="exportToImage()">
            📸 Descargar Imagen
        </button>

        <button class="btn btn-danger" onclick="requestClearAll()">
            🗑 Reiniciar Rifa
        </button>
    </aside>

    <main class="preview-area">
        <div id="export-container">
            <div class="raffle-card" id="raffle-card">
                <div class="r-title" id="preview-title">Título de la Rifa</div>
                <div class="r-price">Valor: <span id="preview-price">0bs</span></div>
                
                <div class="r-grid" id="preview-grid">
                    <!-- Los números se inyectan aquí via JS -->
                </div>
                
                <div class="r-footer" id="preview-footer">Datos de contacto...</div>
            </div>
        </div>
    </main>

    <script>
        const STATE_KEY = 'raffleAppV2Data';
        let defaultState = {
            title: 'Rifa de un Quesillo de 1,5kg',
            price: '1200bs',
            numbersCount: 20,
            bgColor: '#ffffff',
            footer: 'Pago móvil: 0412-1234567\nCI: 12.345.678\nEnviar capture con el nombre',
            takenNumbers: [] 
        };

        let appState = JSON.parse(localStorage.getItem(STATE_KEY));
        let isFirstVisit = !appState;

        if (!appState) appState = { ...defaultState };

        function initApp() {
            if (isFirstVisit) {
                document.getElementById('wizard').classList.add('active');
            }
            populateControls();
            updatePreview();
            generateGrid();
        }

        function closeWizard() {
            document.getElementById('wizard').classList.remove('active');
            isFirstVisit = false;
        }

        function saveWizard() {
            const title = document.getElementById('wiz-title').value.trim();
            const price = document.getElementById('wiz-price').value.trim();
            
            if(title) appState.title = title;
            if(price) appState.price = price;
            
            saveState();
            populateControls();
            updatePreview();
            closeWizard();
        }

        function requestClearAll() {
            document.getElementById('confirm-modal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('active');
        }

        function executeClearAll() {
            localStorage.removeItem(STATE_KEY);
            appState = { ...defaultState, takenNumbers: [] };
            isFirstVisit = true;
            closeConfirmModal();
            
            // Limpiamos visualmente
            document.getElementById('wiz-title').value = '';
            document.getElementById('wiz-price').value = '';
            
            initApp();
        }

        function populateControls() {
            document.getElementById('ctrl-title').value = appState.title;
            document.getElementById('ctrl-price').value = appState.price;
            document.getElementById('ctrl-count').value = appState.numbersCount;
            document.getElementById('ctrl-bg-color').value = appState.bgColor;
            document.getElementById('ctrl-footer').value = appState.footer;
        }

        function updatePreview() {
            appState.title = document.getElementById('ctrl-title').value || 'Sin Título';
            appState.price = document.getElementById('ctrl-price').value || '-';
            appState.bgColor = document.getElementById('ctrl-bg-color').value;
            appState.footer = document.getElementById('ctrl-footer').value || '';

            document.getElementById('preview-title').innerText = appState.title;
            document.getElementById('preview-price').innerText = appState.price;
            document.getElementById('raffle-card').style.backgroundColor = appState.bgColor;
            document.getElementById('preview-footer').innerText = appState.footer;

            saveState();
        }

        function generateGrid() {
            let count = parseInt(document.getElementById('ctrl-count').value);
            // Evitar cuelgues por números absurdos
            if(isNaN(count) || count < 1) count = 20;
            if(count > 100) count = 100; 
            
            appState.numbersCount = count;
            
            const grid = document.getElementById('preview-grid');
            grid.innerHTML = '';

            // Limpiar números guardados que excedan el límite actual
            appState.takenNumbers = appState.takenNumbers.filter(n => n <= count);

            for (let i = 1; i <= count; i++) {
                const numDiv = document.createElement('div');
                numDiv.className = 'r-number';
                numDiv.innerText = i;
                
                if (appState.takenNumbers.includes(i)) {
                    numDiv.classList.add('taken');
                }

                numDiv.onclick = () => toggleNumber(i, numDiv);
                grid.appendChild(numDiv);
            }
            saveState();
        }

        function toggleNumber(number, element) {
            const index = appState.takenNumbers.indexOf(number);
            if (index === -1) {
                appState.takenNumbers.push(number);
                element.classList.add('taken');
            } else {
                appState.takenNumbers.splice(index, 1);
                element.classList.remove('taken');
            }
            saveState();
        }

        function saveState() {
            localStorage.setItem(STATE_KEY, JSON.stringify(appState));
        }

        function exportToImage() {
            const container = document.getElementById('export-container');
            const originalTransform = container.style.transform;
            
            // Temporalmente forzamos estilos para asegurar una captura de alta calidad
            container.style.transform = 'none';

            // html2canvas toma una "foto" del DOM
            html2canvas(container, {
                scale: 2, // Aumenta la resolución
                backgroundColor: null, // Mantiene transparencias si las hay
                useCORS: true
            }).then(canvas => {
                // Restauramos estilos originales
                container.style.transform = originalTransform;

                // Creamos un enlace de descarga
                const link = document.createElement('a');
                link.download = `Rifa-${appState.title.replace(/\s+/g, '-').substring(0,15)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error('Error al exportar imagen:', err);
                // Usar modal custom sería mejor, pero esto es un fallback técnico
                document.getElementById('preview-footer').innerText = 'Error al exportar la imagen. Verifica consola.';
            });
        }

        // Iniciar la app al cargar
        window.onload = initApp;
    </script>
</body>
</html>
